# Dependabot minor/patch updates merge themselves once CI passes; majors are left for a human.
# Needs "Allow auto-merge" in the repo settings and CI as a required check on main.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for non-major updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # The *-minor-and-patch groups (dependabot.yml) hold no majors; other PRs say "from X to Y"
          if [[ "$TITLE" != *"-minor-and-patch group"* ]]; then
            from=$(sed -nE 's/.* from v?([0-9]+)[.0-9]* to v?([0-9]+).*/\1/p' <<<"$TITLE")
            to=$(sed -nE 's/.* from v?([0-9]+)[.0-9]* to v?([0-9]+).*/\2/p' <<<"$TITLE")
            if [[ -z "$from" || "$from" != "$to" ]]; then
              echo "Major or unparseable update ($TITLE): leaving it for review"
              exit 0
            fi
          fi
          gh pr merge --auto --squash "$PR_URL"
