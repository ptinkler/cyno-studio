# ─────────────────────────────────────────────────────────────────────
# This nginx sits behind Synology DSM's reverse proxy (TLS termination).
#
# HTTP→HTTPS redirect is handled by DSM's nginx directly (see
# synology-boot.sh which installs a redirect server block).
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;

    # DSM's proxy (or the docker network) is what connects here, so $remote_addr is the proxy, not the
    # visitor. The app rate-limits logins per address, and with the proxy's address for everyone, ten
    # wrong passwords from anyone would lock every user out. Take the visitor's address from the
    # X-Forwarded-For the proxy sends, but only from peers on private ranges, so a request that reaches
    # this port directly can't claim to be someone else.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Serve Vue static assets with long-term caching
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API, video, and image routes to FastAPI
    location ~ ^/(api|video|video-thumb|image)/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Support large video downloads and uploads
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Tracks the app's largest upload cap (MAX_VIDEO_UPLOAD_BYTES = 200 MB in
        # web/uploads/files.py) plus a little multipart overhead, so the app's own
        # per-type limit — with a clear message — is what rejects, not nginx (413).
        client_max_body_size 210m;
    }

    # Vue Router history mode — all other routes serve index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
