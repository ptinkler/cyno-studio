# Runs on every commit once enabled with `make hooks` (via .githooks/pre-commit,
# which also works when committing from Windows to the repo in WSL).
# The same checks as CI's lint job, on the staged files; fixable problems are
# fixed (re-stage and commit again). Run everything: `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # The Python tools come from the project's .venv (`uv sync`), so uv.lock is the one place their versions are set.
  # The frontend's own ESLint and Prettier need `npm install` in src/js first.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: .venv/bin/basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: eslint
        name: eslint
        entry: src/js/node_modules/.bin/eslint --fix
        language: system
        files: ^src/js/.*\.(js|vue)$
      - id: prettier
        name: prettier
        entry: src/js/node_modules/.bin/prettier --write --ignore-unknown --ignore-path src/js/.prettierignore
        language: system
        files: ^src/js/
