[project]
name = "cyno-studio"
version = "0.0.0"
requires-python = ">=3.13"
# Ranges only; uv.lock holds the exact versions (`make lock`)
dependencies = [
    "alembic",
    "anyio",
    "argon2-cffi",
    "Authlib",
    "beautifulsoup4",
    "cryptography",
    "fastapi",
    "httpx",
    "itsdangerous",
    "openai",
    "opencv-python",
    "Pillow",
    "pip-system-certs",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "requests",
    "SQLAlchemy",
    "starlette",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "basedpyright",
    "httpx2",  # Starlette's TestClient
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.uv]
package = false  # the app runs from source; nothing to build


[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["data", "src/js"]
src = [".", "src/py"]  # import roots: the repo root (tests, scripts) and the Python source root (web)

[tool.ruff.lint]
select = [
    "ANN",      # flake8-annotations: Forces strict type hints everywhere
    "ASYNC",    # blocking calls inside async def (FastAPI: blocks the event loop)
    "B",        # bugbear: likely bugs
    "C4",       # comprehensions
    "C90",      # function complexity (mccabe)
    "D",        # pydocstyle: Enforces docstring consistency (Google/NumPy style)
    "E",        # pycodestyle errors (PEP 8) — E402 bans imports after code
    "ERA",      # commented-out code
    "F",        # pyflakes: unused names, undefined names
    "FLY",      # static str.join -> f-string
    "FURB",     # refurb: dated idioms
    "G",        # logging calls: no f-strings, no str.format
    "I",        # import sorting (alphabetical, grouped)
    "ICN",      # conventional import aliases
    "ISC",      # implicit string concatenation
    "LOG",      # logging misuse
    "N",        # pep8-naming
    "PERF",     # avoidable overhead
    "PIE",      # unnecessary code
    "PLC0415",  # imports belong at the top of the file, never inside a function
    "PT",       # pytest style
    "RET",      # return-statement consistency
    "RSE",      # unnecessary parentheses on raise
    "RUF",      # ruff-specific — RUF100 catches `noqa` that suppresses nothing
    "S",        # bandit: security
    "SIM",      # simplifications
    "SLF",      # reaching into another module's _private names
    "SLOT",     # __slots__ on str/tuple/namedtuple subclasses
    "T20",      # print() — the server logs, it does not print
    "TC",       # imports only needed for type checking
    "UP",       # pyupgrade: modern syntax for the target version
    "W",        # pycodestyle warnings
    "PYI",      # Enforce clean, modern typing conventions (e.g., `X | Y` instead of `Union`)
    "PGH003",   # Require specific error codes on `# type: ignore` comments (prevents blanket ignores)
    "ARG",      # flake8-unused-arguments: catches unused function parameters
    "BLE",      # flake8-blind-except: prevents broad `except Exception:`
    "DTZ",      # flake8-datetimez: requires timezone-aware datetimes
    "FAST",     # FastAPI-specific lint rules
    "PTH",      # flake8-use-pathlib: enforces pathlib over os.path
    "TRY",      # tryceratops: clean exception handling patterns
    "A",        # flake8-builtins: no variable shadows a Python builtin
    "PLW",      # pylint warnings: no `global`, no clobbered loop variables
    "PLR0911",  # at most 6 return statements per function
    "PLR0912",  # at most 12 branches per function
    "PLR0915",  # at most 50 statements per function
    "PLR0913",  # at most 5 arguments per function: group related ones into a request object
    "PLR2004",  # no bare numbers in comparisons: name them (HTTPStatus for status codes)
    "FBT",      # flag arguments (bool) are keyword-only, so call sites read `fn(x, strict=True)`
]

ignore = [
    "ISC001",   # Conflicts with Ruff's formatter
    "COM812",   # Conflicts with Ruff's formatter
    "D100",     # Don't require docstrings at the top of every module
    "D104",     # Don't require docstrings in __init__.py files
    "D107",     # Don't require docstrings in __init__ methods (document the class instead)
]

[tool.ruff.lint.mccabe]
# Functions that grow past this are split up — complexity is never silenced with `noqa`.
max-complexity = 7

[tool.ruff.lint.pydocstyle]
convention = "google"  # Standardized docstring formatting

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.lint.flake8-type-checking]
# Stops Ruff from moving Pydantic models & FastAPI dependencies into `if TYPE_CHECKING:`
# (which would crash FastAPI at runtime when building OpenAPI schemas)
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
]

[tool.ruff.lint.flake8-bugbear]
# Tells Ruff that FastAPI's `Depends()`, `Query()`, `Body()`, etc. are valid default arguments
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Tests only, approved by the maintainer:
# - S101: assert is how pytest tests express checks; the -O concern behind the rule never applies.
# - ANN: basedpyright strict already requires annotations (enforced there); no double-reporting.
# - ARG: fixtures requested for their side effects and stand-ins that must match a replaced signature.
# - PLR0913: a test's arguments are the pytest fixtures it requests; there is nothing to group.
# - PLR2004: tests assert exact counts and values; naming each expected number would only obscure them.
# - FBT: test helpers and parametrised cases take plain booleans (`flag: bool`) for readability.
"tests/*" = ["S101", "ANN", "ARG", "PLR0913", "PLR2004", "FBT"]

[tool.ruff.lint.isort]
known-first-party = ["web", "tests"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# Strict type checking with no baseline: every diagnostic fails lint.
[tool.basedpyright]
typeCheckingMode = "strict"
extraPaths = ["src/py"]
reportExplicitAny = "error"
reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
